<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pro Glass Camera</title>
  <meta name="theme-color" content="#0b0f14" />
  <style>
    :root{
      --bg:#0b0f14;
      --panel:rgba(18,24,31,.72);
      --stroke:rgba(255,255,255,.10);
      --text:#eef3f7;
      --muted:#a7b1bb;
      --accent:#7dd3fc;
      --good:#34d399;
      --danger:#fb7185;
      --shadow:0 16px 50px rgba(0,0,0,.45);
      --r:22px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:100%;height:100%;
      background:var(--bg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif;
      color:var(--text);
      overflow:hidden
    }
    body{
      background:
        radial-gradient(circle at top, rgba(125,211,252,.18), transparent 34%),
        radial-gradient(circle at 20% 20%, rgba(167,139,250,.16), transparent 22%),
        linear-gradient(180deg,#0b0f14 0%, #0b1118 100%);
    }
    .app{
      height:100vh;
      display:flex;
      flex-direction:column;
      padding:12px;
      gap:12px;
      padding-top:calc(12px + env(safe-area-inset-top));
      padding-bottom:calc(12px + env(safe-area-inset-bottom));
      padding-left:calc(12px + env(safe-area-inset-left));
      padding-right:calc(12px + env(safe-area-inset-right));
    }
    .topbar,.panel,.bottom{
      background:var(--panel);
      border:1px solid var(--stroke);
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border-radius:var(--r);
    }
    .topbar{
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{display:flex;flex-direction:column;gap:2px}
    .brand h1{font-size:1rem;letter-spacing:.3px}
    .brand p{font-size:.78rem;color:var(--muted)}
    .mode-pill{
      display:flex;gap:6px;align-items:center;
      padding:8px 10px;border-radius:999px;
      background:rgba(255,255,255,.05);
      border:1px solid var(--stroke);
      font-size:.8rem;color:var(--muted)
    }

    .viewport{
      flex:1;
      position:relative;
      border-radius:28px;
      overflow:hidden;
      background:#000;
      border:1px solid rgba(255,255,255,.08);
      box-shadow:var(--shadow);
    }
    video{
      width:100%;
      height:100%;
      object-fit:cover;
      transform:scale(1.01);
      display:block;
      filter:contrast(1.02) saturate(1.08)
    }

    .grid{
      position:absolute;inset:0;pointer-events:none;opacity:0;transition:.2s;
      background-image:
        linear-gradient(to right, rgba(255,255,255,.16) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.16) 1px, transparent 1px);
      background-size:33.33% 100%, 100% 33.33%;
      mix-blend-mode:screen
    }
    .grid.show{opacity:.55}
    .vignette{
      position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(circle at center, transparent 54%, rgba(0,0,0,.38) 100%)
    }

    .hud{
      position:absolute;left:12px;right:12px;top:12px;
      display:flex;justify-content:space-between;align-items:flex-start;gap:10px
    }
    .hud .chip{
      padding:10px 12px;border-radius:14px;
      background:rgba(10,14,18,.54);
      border:1px solid rgba(255,255,255,.08);
      font-size:.82rem;color:#dbe6ef;
      display:flex;align-items:center;gap:8px;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px)
    }

    .zoom-box{
      position:absolute;left:14px;right:14px;bottom:108px;
      padding:12px;border-radius:18px;
      background:rgba(10,14,18,.56);
      border:1px solid rgba(255,255,255,.08);
      display:flex;align-items:center;gap:10px;
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px)
    }
    input[type="range"]{width:100%;accent-color:var(--accent)}

    .capture-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
    .capture-flash.run{animation:flash .28s ease}
    @keyframes flash{0%{opacity:0}20%{opacity:.95}100%{opacity:0}}

    .capture-ring{
      position:absolute;left:50%;bottom:28px;
      width:94px;height:94px;margin-left:-47px;
      border-radius:50%;
      border:3px solid rgba(255,255,255,.65);
      opacity:0;transform:scale(.6);
      pointer-events:none
    }
    .capture-ring.run{animation:ring .45s ease}
    @keyframes ring{
      0%{opacity:0;transform:scale(.55)}
      20%{opacity:1}
      100%{opacity:0;transform:scale(1.25)}
    }

    .bottom{
      padding:10px;
      display:flex;
      align-items:center;
      gap:10px;
      overflow:hidden;
    }
    .thumb{
      width:64px;height:64px;flex:0 0 auto;
      border-radius:18px;overflow:hidden;
      background:#111;border:1px solid rgba(255,255,255,.10);
      display:flex;align-items:center;justify-content:center
    }
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .thumb.empty{color:#66727f;font-size:.7rem}

    .small{font-size:.76rem;color:var(--muted);white-space:nowrap}
    .spacer{flex:1}

    .shutter-wrap{
      width:132px;height:132px;
      display:flex;align-items:center;justify-content:center;
      border-radius:50%;
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.10);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 10px 24px rgba(0,0,0,.35);
      flex:0 0 auto;
    }
    .shutter{
      width:94px;height:94px;
      border-radius:50%;
      border:none;outline:none;cursor:pointer;
      position:relative;
      background:radial-gradient(circle at 30% 30%, #ffffff 0%, #dfe7ef 32%, #aab6c4 70%, #8c99a8 100%);
      box-shadow:
        inset 0 0 0 10px rgba(255,255,255,.85),
        inset 0 0 0 18px rgba(15,20,26,.88),
        0 0 0 2px rgba(255,255,255,.12),
        0 16px 28px rgba(0,0,0,.40);
      transition:.18s transform ease;
    }
    .shutter:active{transform:scale(.96)}
    .shutter::after{
      content:"";
      position:absolute;inset:18px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,.55);
    }

    .carousel{
      display:flex;
      gap:10px;
      overflow:auto;
      padding-bottom:2px;
      scrollbar-width:none;
    }
    .carousel::-webkit-scrollbar{display:none}
    .mode-item{
      min-width:84px;
      padding:12px 14px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.06);
      color:var(--muted);
      text-align:center;
      font-size:.82rem;
      font-weight:700;
      cursor:pointer;
      white-space:nowrap;
      transition:.18s transform,.18s background,.18s border-color;
      flex:0 0 auto;
    }
    .mode-item.active{
      color:var(--text);
      background:linear-gradient(180deg, rgba(125,211,252,.22), rgba(167,139,250,.14));
      border-color:rgba(125,211,252,.35)
    }

    .icons-row{
      display:flex;gap:10px;align-items:center;
    }
    .icon-btn{
      width:54px;height:54px;border-radius:18px;border:none;cursor:pointer;
      color:var(--text);
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      display:flex;align-items:center;justify-content:center;
    }
    .icon{width:20px;height:20px;display:inline-block;vertical-align:middle}
    .hidden{display:none !important}
    @media (max-width:420px){
      .zoom-box{bottom:102px}
      .shutter-wrap{width:120px;height:120px}
      .shutter{width:84px;height:84px}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <h1>Pro Glass Camera</h1>
        <p>Samsung-style camera UI</p>
      </div>
      <div class="mode-pill" id="modeText">HD Mode</div>
    </div>

    <div class="viewport">
      <video id="video" playsinline autoplay muted></video>
      <div class="grid" id="grid"></div>
      <div class="vignette"></div>
      <div class="capture-flash" id="flash"></div>
      <div class="capture-ring" id="ring"></div>

      <div class="hud">
        <div class="chip" id="lensChip">
          <span id="lensLabel">Back Camera</span>
        </div>
        <div class="chip" id="qualityChip">HD</div>
      </div>

      <div class="zoom-box">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M11 5a6 6 0 1 1 0 12a6 6 0 0 1 0-12Z" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="zoom" type="range" min="1" max="4" step="0.1" value="1">
      </div>
    </div>

    <div class="bottom">
      <div class="thumb empty" id="thumb">Gallery</div>

      <div class="icons-row">
        <button class="icon-btn" id="switchBtn" title="Switch camera">
          <svg class="icon" viewBox="0 0 24 24" fill="none">
            <path d="M7 7h11l-2-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17 17H6l2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 7a7 7 0 0 1 10 10" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </button>
        <button class="icon-btn" id="gridBtn" title="Grid">
          <svg class="icon" viewBox="0 0 24 24" fill="none">
            <path d="M4 4h16v16H4z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </button>
      </div>

      <div class="spacer"></div>

      <div class="shutter-wrap">
        <button class="shutter" id="captureBtn" aria-label="Capture"></button>
      </div>

      <div class="spacer"></div>

      <button class="icon-btn" id="downloadBtn" title="Save" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="none">
          <path d="M12 3v10m0 0l4-4m-4 4l-4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.8"/>
        </svg>
      </button>
    </div>

    <div class="panel" style="padding:10px;">
      <div class="carousel" id="carousel">
        <div class="mode-item active" data-mode="HD">HD</div>
        <div class="mode-item" data-mode="DSLR">DSLR</div>
        <div class="mode-item" data-mode="SUPER">Super DSLR</div>
        <div class="mode-item" data-mode="PORTRAIT">Portrait</div>
        <div class="mode-item" data-mode="NIGHT">Night</div>
      </div>
    </div>
  </div>

  <canvas id="canvas" class="hidden"></canvas>

  <script>
    const video=document.getElementById('video'),canvas=document.getElementById('canvas'),grid=document.getElementById('grid'),flash=document.getElementById('flash'),ring=document.getElementById('ring'),zoom=document.getElementById('zoom'),thumb=document.getElementById('thumb'),modeText=document.getElementById('modeText'),lensLabel=document.getElementById('lensLabel'),qualityChip=document.getElementById('qualityChip'),captureBtn=document.getElementById('captureBtn'),downloadBtn=document.getElementById('downloadBtn'),switchBtn=document.getElementById('switchBtn'),gridBtn=document.getElementById('gridBtn'),carousel=document.getElementById('carousel');
    let stream=null,facing='environment',mode='HD',captured=null,track=null;
    const waits=ms=>new Promise(r=>setTimeout(r,ms));
    const modes={HD:{width:{ideal:1920},height:{ideal:1080}},DSLR:{width:{ideal:2560},height:{ideal:1440}},SUPER:{width:{ideal:3840},height:{ideal:2160}},PORTRAIT:{width:{ideal:1920},height:{ideal:1080}},NIGHT:{width:{ideal:1280},height:{ideal:720}}};

    function setActiveMode(name){
      mode=name;
      document.querySelectorAll('.mode-item').forEach(el=>el.classList.toggle('active', el.dataset.mode===name));
      modeText.textContent = name==='SUPER'?'Super DSLR Mode':name==='DSLR'?'DSLR Mode':name==='PORTRAIT'?'Portrait Mode':name==='NIGHT'?'Night Mode':'HD Mode';
      qualityChip.textContent = modeText.textContent;
    }

    async function stopStream(){
      if(stream) stream.getTracks().forEach(t=>t.stop());
      stream=null; track=null;
    }

    async function startCamera(){
      await stopStream();
      const constraints={audio:false,video:{facingMode:{ideal:facing},...modes[mode],aspectRatio:{ideal:16/9}}};
      stream=await navigator.mediaDevices.getUserMedia(constraints);
      track=stream.getVideoTracks()[0];
      video.srcObject=stream;
      await video.play();
      lensLabel.textContent=facing==='user'?'Front Camera':'Back Camera';
      captureBtn.disabled=false;
      downloadBtn.disabled=!captured;
      applyZoom();
    }

    function applyZoom(){
      const z=Number(zoom.value);
      if(track&&track.getCapabilities&&track.getCapabilities().zoom){
        track.applyConstraints({advanced:[{zoom:z}]}).catch(()=>{});
      }else{
        video.style.transform=`scale(${z})`;
      }
    }

    async function capture(){
      if(!video.videoWidth) return;
      flash.classList.remove('run'); ring.classList.remove('run'); void flash.offsetWidth;
      flash.classList.add('run'); ring.classList.add('run');
      canvas.width=video.videoWidth; canvas.height=video.videoHeight;
      canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
      captured=canvas.toDataURL('image/png');
      thumb.innerHTML=`<img src="${captured}" alt="thumbnail">`;
      downloadBtn.disabled=false;
      await waits(250);
    }

    switchBtn.onclick=async()=>{facing=facing==='environment'?'user':'environment';await startCamera()};
    gridBtn.onclick=()=>grid.classList.toggle('show');
    captureBtn.onclick=capture;
    downloadBtn.onclick=()=>{if(!captured) return; const a=document.createElement('a'); a.href=captured; a.download=`pro-camera-${Date.now()}.png`; a.click()};
    zoom.oninput=applyZoom;
    document.querySelectorAll('.mode-item').forEach(el=>{
      el.onclick=async()=>{
        setActiveMode(el.dataset.mode);
        await startCamera();
      };
    });

    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
    }

    (async()=>{
      try{
        setActiveMode('HD');
        await startCamera();
      }catch(e){
        modeText.textContent='Camera permission needed';
      }
    })();
  </script>
</body>
</html>
